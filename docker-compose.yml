services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Healthcheck so the app waits for Postgres to actually accept connections,
    # not merely for the container to start. pg_isready returns success only
    # once the server is ready to serve queries.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    # Persist data across restarts (optional for this task, but standard).
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    # Host of the DB is the service name 'db', resolved on the compose network.
    # The +psycopg driver selects psycopg 3 in async mode.
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TRANSFORMER_DELAY_SECONDS: ${TRANSFORMER_DELAY_SECONDS}
    # Wait until the DB healthcheck passes before starting, so init_db on
    # startup does not hit a database that is not ready yet.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata: